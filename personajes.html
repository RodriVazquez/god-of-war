<!DOCTYPE html>
<html lang="es" data-saga="nordica">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personajes — God of War</title>
  <meta name="description" content="Personajes de las sagas griega y nórdica de God of War, con filtros y búsqueda.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Eczar:wght@600;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor cabecera__interior">
      <a class="marca" href="index.html">God of <span>War</span></a>

      <nav class="navegacion" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="personajes.html" aria-current="page">Personajes</a>
        <a href="lugares.html">Lugares</a>
        <a href="index.html#cronologia-seccion">Cronología</a>
      </nav>

      <div class="interruptor" role="group" aria-label="Elegir saga">
        <button type="button" data-cambiar-saga="griega" aria-pressed="false">Griega</button>
        <button type="button" data-cambiar-saga="nordica" aria-pressed="true">Nórdica</button>
      </div>
    </div>
  </header>

  <main class="contenedor" style="padding-block: var(--e-5)">

    <div class="seccion__encabezado">
      <p class="rotulo">Catálogo</p>
      <h2>Personajes</h2>
      <p>Filtrá por saga o escribí un nombre para encontrarlo.</p>
    </div>

    <div class="controles">
      <div class="filtros" role="group" aria-label="Filtrar por saga">
        <button class="filtro" type="button" data-filtro="todos" aria-pressed="true">Todos</button>
        <button class="filtro" type="button" data-filtro="griega" aria-pressed="false">Griega</button>
        <button class="filtro" type="button" data-filtro="nordica" aria-pressed="false">Nórdica</button>
      </div>

      <p class="rotulo" id="contador" aria-live="polite"></p>

      <label class="solo-lectores" for="buscador">Buscar personaje</label>
      <input class="buscador" type="search" id="buscador" placeholder="Buscar por nombre…">
    </div>

    <ul class="rejilla" id="listado"></ul>

  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>Sitio de fans con fines educativos. God of War es propiedad de Sony Interactive Entertainment y Santa Monica Studio.</p>
    </div>
  </footer>

  <script src="js/data-personajes.js"></script>
  <script src="js/data-lugares.js"></script>
  <script src="js/data-juegos.js"></script>
  <script src="js/data-valquirias.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
